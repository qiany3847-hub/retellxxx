<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RetellNote</title>
  
  <script>
    // 拦截错误显示在屏幕上，拒绝死无对证的白屏
    window.onerror = function(msg) {
      document.getElementById('root').innerHTML = '<div style="padding:40px;color:#ef4444;text-align:center;font-weight:bold;">框架加载异常或被网络拦截。<br><br><span style="font-size:12px;color:#999">' + msg + '</span></div>';
    };
  </script>

  <!-- 替换为国内高速 CDN 节点，秒开且不会被墙 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.staticfile.net/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdn.staticfile.net/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.staticfile.net/babel-standalone/7.23.6/babel.min.js"></script>
</head>
<body class="bg-[#F9F9F7] text-stone-800 font-sans">
  <div id="root">
    <div style="text-align: center; padding-top: 35vh; color: #a8a29e; font-family: sans-serif;">
      <span style="font-size: 28px; display: inline-block; animation: pulse 1.5s infinite;">⏳</span><br><br>
      <span style="font-size: 14px;">正在连接国内高速节点，请稍候...</span>
    </div>
  </div>
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    const getApiKey = () => {
      try { const item = window.localStorage.getItem('gemini_api_key'); return item ? JSON.parse(item) : ""; } 
      catch { return ""; }
    };

    const callGemini = async (prompt, schema) => {
      const apiKey = getApiKey();
      if (!apiKey) throw new Error("API Key missing");
      const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`;
      const response = await fetch(API_URL, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }],
          systemInstruction: { parts: [{ text: "你是一个专业的英语口语教练。请严格按照要求的JSON格式输出结果。纯中文回复，绝对不要使用星号标记。" }] },
          generationConfig: { responseMimeType: "application/json", responseSchema: schema }
        })
      });
      const data = await response.json();
      if (data.candidates && data.candidates[0].content.parts[0].text) {
        return JSON.parse(data.candidates[0].content.parts[0].text);
      }
      throw new Error("Invalid API response");
    };

    function createWavBlob(base64Data, sampleRate = 24000) {
      const binaryString = window.atob(base64Data);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
      const buffer = new ArrayBuffer(44 + bytes.length);
      const view = new DataView(buffer);
      const writeString = (offset, string) => { for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i)); };
      writeString(0, 'RIFF'); view.setUint32(4, 36 + bytes.length, true);
      writeString(8, 'WAVE'); writeString(12, 'fmt ');
      view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true); view.setUint16(34, 16, true);
      writeString(36, 'data'); view.setUint32(40, bytes.length, true);
      new Uint8Array(buffer, 44).set(bytes);
      return new Blob([buffer], { type: 'audio/wav' });
    }

    const callGeminiTTS = async (text) => {
      const apiKey = getApiKey();
      if (!text || !apiKey) return;
      const cleanText = text.replace(/\*\*/g, '');
      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: cleanText }] }],
            generationConfig: { responseModalities: ["AUDIO"], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Aoede" } } } },
            model: "gemini-2.5-flash-preview-tts"
          })
        });
        const data = await response.json();
        const base64Data = data.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
        if (base64Data) {
          const audio = new Audio(URL.createObjectURL(createWavBlob(base64Data, 24000)));
          audio.play();
        }
      } catch (err) { alert("语音合成失败，请检查网络。"); }
    };

    function useLocalStorage(key, initialValue) {
      const [storedValue, setStoredValue] = useState(() => {
        try { const item = window.localStorage.getItem(key); return item ? JSON.parse(item) : initialValue; } 
        catch (error) { return initialValue; }
      });
      const setValue = (value) => {
        try { const valueToStore = value instanceof Function ? value(storedValue) : value;
          setStoredValue(valueToStore); window.localStorage.setItem(key, JSON.stringify(valueToStore));
        } catch (error) { console.error(error); }
      };
      return [storedValue, setValue];
    }

    function useSpeech() {
      const [isRecording, setIsRecording] = useState(false);
      const [transcript, setTranscript] = useState({ text: '' });
      const recognitionRef = useRef(null);
      useEffect(() => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
          const recognition = new SpeechRecognition();
          recognition.continuous = true; recognition.interimResults = false; recognition.lang = 'en-US';
          recognition.onresult = (event) => {
            let finalStr = '';
            for (let i = event.resultIndex; i < event.results.length; i++) {
              if (event.results[i].isFinal) finalStr += event.results[i][0].transcript;
            }
            if (finalStr) setTranscript({ text: finalStr.trim() });
          };
          recognition.onend = () => setIsRecording(false);
          recognitionRef.current = recognition;
        }
      }, []);
      const startRecording = useCallback(() => { if (recognitionRef.current) { recognitionRef.current.start(); setIsRecording(true); } }, []);
      const stopRecording = useCallback(() => { if (recognitionRef.current) { recognitionRef.current.stop(); setIsRecording(false); } }, []);
      return { isRecording, transcript, startRecording, stopRecording };
    }

    const FormatBoldText = ({ text }) => {
      if (!text) return null;
      const parts = text.split(/(\*\*.*?\*\*)/g);
      return <span>{parts.map((part, i) => part.startsWith('**') && part.endsWith('**') ? <strong key={i} className="font-bold text-stone-900 mx-0.5">{part.slice(2, -2)}</strong> : part)}</span>;
    };

    const TtsButton = ({ text, className = "" }) => {
      const [isPlaying, setIsPlaying] = useState(false);
      const handlePlay = async () => {
        if (isPlaying) return;
        setIsPlaying(true); await callGeminiTTS(text); setIsPlaying(false);
      };
      return (
        <button onClick={handlePlay} disabled={isPlaying} className={`flex items-center justify-center p-1.5 rounded-full bg-stone-100 text-stone-500 hover:bg-stone-200 transition-all ${className}`}>
          {isPlaying ? '⏳' : '🔊'}
        </button>
      );
    }

    const SpeechTextarea = ({ label, value, onChange, placeholder }) => {
      const { isRecording, transcript, startRecording, stopRecording } = useSpeech();
      const [localText, setLocalText] = useState(value);
      useEffect(() => setLocalText(value), [value]);
      useEffect(() => { if (isRecording && transcript.text) onChange((localText ? localText + ' ' : '') + transcript.text); }, [transcript]);
      
      return (
        <div className="flex flex-col gap-2 mb-6">
          <label className="text-sm font-semibold text-stone-700">{label}</label>
          <div className="relative">
            <textarea className="w-full h-40 p-4 bg-stone-50 border border-stone-300 rounded-sm focus:outline-none focus:border-stone-500 text-stone-800" placeholder={placeholder} value={localText} onChange={(e) => {setLocalText(e.target.value); onChange(e.target.value);}} />
            <button onClick={isRecording ? stopRecording : startRecording} className={`absolute bottom-3 right-3 p-2 rounded-full ${isRecording ? 'bg-red-500 text-white animate-pulse' : 'bg-stone-200 text-stone-600'}`}>
              {isRecording ? '⏹' : '🎤'}
            </button>
          </div>
        </div>
      );
    };

    function App() {
      const [apiKey, setApiKey] = useLocalStorage('gemini_api_key', '');
      const [keyInput, setKeyInput] = useState('');
      const [activeTab, setActiveTab] = useState('practice'); 
      const [toastMessage, setToastMessage] = useState('');
      const [dbStats, setDbStats] = useLocalStorage('retell_stats', { practiceCount: 0 });
      const [dbExpressions, setDbExpressions] = useLocalStorage('retell_expressions', []);
      const [originalText, setOriginalText] = useState('');
      const [retellText, setRetellText] = useState('');
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [analysisResult, setAnalysisResult] = useState(null);

      if (!apiKey) {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center p-6 bg-[#F9F9F7]">
            <div className="max-w-md w-full bg-white p-8 rounded-sm shadow-sm border border-stone-200 text-center">
              <div className="text-4xl mb-4">🔑</div>
              <h1 className="font-serif font-bold text-2xl text-stone-800 mb-4">连接 AI 引擎</h1>
              <p className="text-sm text-stone-600 mb-6 leading-relaxed">由于隐私保护限制，你的私人表达库完全离线运行。<br/>请粘贴 API Key 以激活 AI 能力，密钥仅保存在本机。</p>
              <input type="password" placeholder="粘贴 AIza 打头的密钥" value={keyInput} onChange={(e) => setKeyInput(e.target.value.trim())} className="w-full p-3 border border-stone-300 rounded-sm mb-6 text-sm focus:outline-none focus:border-stone-800" />
              <button onClick={() => setApiKey(keyInput)} disabled={!keyInput.startsWith('AIza')} className="w-full py-3.5 bg-stone-800 text-white font-medium rounded-sm disabled:bg-stone-300">保存并进入</button>
            </div>
          </div>
        );
      }

      const showToast = (msg) => { setToastMessage(msg); setTimeout(() => setToastMessage(''), 3000); };

      const handleAnalyze = async () => {
        if (!originalText.trim() || !retellText.trim()) return;
        setIsAnalyzing(true);
        const schema = {
          type: "OBJECT",
          properties: {
            grammar: { type: "ARRAY", items: { type: "OBJECT", properties: { original: { type: "STRING" }, corrected: { type: "STRING" }, explanation: { type: "STRING" }, type: { type: "STRING" } } } },
            upgrades: { type: "ARRAY", items: { type: "OBJECT", properties: { original_simple_sentence: { type: "STRING" }, better_expression_sentence: { type: "STRING" }, base_phrase: { type: "STRING" }, ai_example: { type: "OBJECT", properties: { en: { type: "STRING" }, zh: { type: "STRING" } } } } } },
            final_polished_text: { type: "STRING" }
          },
          required: ["grammar", "upgrades", "final_polished_text"]
        };
        try {
          const result = await callGemini(`原文：${originalText}\n复述：${retellText}\n任务：找出语法错误并给出表达升级。`, schema);
          setAnalysisResult(result); setDbStats(p => ({ practiceCount: p.practiceCount + 1 })); setActiveTab('analysis');
        } catch (e) { alert("网络请求失败，可能是 API Key 无效或网络波动，请检查。"); } 
        finally { setIsAnalyzing(false); }
      };

      const saveExpression = (exp) => {
        if (dbExpressions.some(e => e.expression === exp.base_phrase)) return showToast("已存在于表达库！");
        setDbExpressions(prev => [{ id: Date.now(), expression: exp.base_phrase, explanation: `${exp.ai_example.en}\n${exp.ai_example.zh}`, interval: 1, nextReviewDate: Date.now() + 86400000 }, ...prev]);
        showToast("存入成功！");
      };

      return (
        <div className="pb-24">
          {toastMessage && <div className="fixed top-6 left-1/2 transform -translate-x-1/2 z-50 bg-stone-800 text-white px-5 py-2.5 rounded-sm shadow-xl text-sm whitespace-nowrap">✅ {toastMessage}</div>}
          <header className="bg-[#F9F9F7] border-b border-stone-200 sticky top-0 z-10 px-4 py-3 text-center font-serif font-bold text-xl text-stone-800">RetellNote</header>
          
          <main className="p-4 sm:p-6 max-w-2xl mx-auto">
            {activeTab === 'practice' && (
              <div className="animate-fade-in">
                <SpeechTextarea label="原文材料 (Source text)" value={originalText} onChange={setOriginalText} placeholder="在此粘贴原文..." />
                <SpeechTextarea label="你的复述 (Your retelling)" value={retellText} onChange={setRetellText} placeholder="点击麦克风开始录音，或手动打字..." />
                <button onClick={handleAnalyze} disabled={isAnalyzing} className="w-full py-4 mt-2 bg-stone-800 text-white font-medium rounded-sm hover:bg-stone-900 transition-colors">{isAnalyzing ? '⏳ 引擎分析中...' : '开始分析'}</button>
              </div>
            )}
            
            {activeTab === 'analysis' && analysisResult && (
              <div className="space-y-8 animate-fade-in">
                <button onClick={() => setActiveTab('practice')} className="flex items-center gap-2 text-sm text-stone-500 font-medium">⬅️ 返回练习页面</button>
                <div>
                  <h2 className="text-lg font-bold mb-4 text-stone-800">语法订正</h2>
                  {analysisResult.grammar.length === 0 ? (<p className="text-stone-500 text-sm">本次复述没有明显的语法错误，非常棒！</p>) : analysisResult.grammar.map((item, i) => (
                    <div key={i} className="bg-white p-5 border border-stone-200 rounded-sm mb-3 shadow-sm">
                      <p className="line-through text-stone-400 mb-3">{item.original}</p>
                      <p className="font-medium flex gap-3 items-center text-lg"><FormatBoldText text={item.corrected} /><TtsButton text={item.corrected} /></p>
                      <p className="text-sm text-stone-600 bg-stone-50 p-3 mt-3 border border-stone-100">💡 {item.explanation}</p>
                    </div>
                  ))}
                </div>
                <div>
                  <h2 className="text-lg font-bold mb-4 text-stone-800">表达升级</h2>
                  {analysisResult.upgrades.length === 0 ? (<p className="text-stone-500 text-sm">暂无升级建议。</p>) : analysisResult.upgrades.map((item, i) => (
                    <div key={i} className="bg-white p-5 border border-stone-200 rounded-sm mb-4 shadow-sm">
                      <p className="text-stone-400 text-xs tracking-wider uppercase mb-1">你的原句</p>
                      <p className="text-stone-600 mb-4"><FormatBoldText text={item.original_simple_sentence}/></p>
                      <p className="text-stone-400 text-xs tracking-wider uppercase mb-1">地道表达</p>
                      <p className="font-bold flex gap-3 items-center mb-4 text-lg text-stone-900"><FormatBoldText text={item.better_expression_sentence}/><TtsButton text={item.better_expression_sentence} /></p>
                      <div className="bg-stone-50 p-4 mb-4 text-sm border border-stone-100">
                        <p className="font-bold text-stone-800 mb-2 border-b border-stone-200 pb-2">核心短语：{item.base_phrase}</p>
                        <p className="text-stone-800">{item.ai_example.en}</p>
                        <p className="text-stone-500 mt-1">{item.ai_example.zh}</p>
                      </div>
                      <button onClick={() => saveExpression(item)} className="bg-stone-800 text-white px-4 py-2 text-sm font-medium rounded-sm hover:bg-stone-900 transition-colors">💾 存入表达库</button>
                    </div>
                  ))}
                </div>
                <div className="bg-white p-5 border border-stone-200 rounded-sm shadow-sm">
                  <h2 className="font-bold mb-3 text-stone-800">完整润色参考</h2>
                  <p className="leading-relaxed text-stone-800"><FormatBoldText text={analysisResult.final_polished_text}/></p>
                </div>
              </div>
            )}

            {activeTab === 'library' && (
              <div className="animate-fade-in">
                <h2 className="text-xl font-bold mb-6 text-stone-800">我的表达库 <span className="text-stone-400 text-lg font-normal">({dbExpressions.length})</span></h2>
                {dbExpressions.length === 0 && <p className="text-stone-500 text-center py-10">还没有收藏任何表达哦</p>}
                {dbExpressions.map(exp => (
                  <div key={exp.id} className="bg-white p-5 border border-stone-200 rounded-sm mb-4 shadow-sm">
                    <p className="font-bold text-xl flex items-center justify-between gap-2 text-stone-900">
                      <span>{exp.expression}</span> <TtsButton text={exp.expression}/>
                    </p>
                    <div className="border-t border-stone-100 mt-3 pt-3">
                      <p className="text-sm text-stone-600 whitespace-pre-line leading-relaxed">{exp.explanation}</p>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </main>

          <nav className="fixed bottom-0 w-full bg-[#F9F9F7] border-t border-stone-200 flex justify-around items-center h-[72px] pb-safe text-xs font-medium text-stone-500 z-20 shadow-[0_-4px_12px_rgba(0,0,0,0.02)]">
            <button onClick={() => setActiveTab('practice')} className={`flex flex-col items-center justify-center w-full h-full space-y-1 transition-colors ${(activeTab === 'practice' || activeTab === 'analysis') ? 'text-stone-900' : ''}`}><span className="text-2xl mb-1">📝</span><span>练习</span></button>
            <button onClick={() => setActiveTab('library')} className={`flex flex-col items-center justify-center w-full h-full space-y-1 transition-colors ${activeTab === 'library' ? 'text-stone-900' : ''}`}><span className="text-2xl mb-1">📚</span><span>表达库</span></button>
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
  <style>
    .pb-safe { padding-bottom: calc(env(safe-area-inset-bottom) + 8px); }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
  </style>
</body>
</html>
</html>
