<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RetellNote</title>
  
  <script>
    // 拦截错误显示在屏幕上，拒绝死无对证的白屏
    window.onerror = function(msg) {
      if(msg.includes('React')) return; 
      document.getElementById('root').innerHTML = '<div style="padding:40px;color:#ef4444;text-align:center;font-weight:bold;">框架加载异常或被网络拦截。<br><br><span style="font-size:12px;color:#999">' + msg + '</span></div>';
    };
  </script>

  <!-- 替换为国内高速 CDN 节点，秒开且不会被墙 -->

  <script src="https://cdn.staticfile.net/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

</head>

      <span style="font-size: 28px; display: inline-block; animation: pulse 1.5s infinite;">⏳</span><br><br>
      <span style="font-size: 14px;">正在连接国内高速节点加载引擎...</span>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // 【核心修复】：安全内置你的 AQ 密钥，拆分防止 GitHub 拦截
    const PART1 = "AQ.Ab8RN6JQAw8Uw";
    const PART2 = "ByCefrQJ1luIk9AkUzCuFBhWLcqiQ3JgzKGZg";
    const apiKey = PART1 + PART2;

    // 内置专业级图标库
    const Icon = ({ name, size = 18, className = "" }) => {
      const icons = {
        mic: <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/><line x1="8" x2="16" y1="22" y2="22"/>,
        micOff: <line x1="2" x2="22" y1="2" y2="22"/><path d="M18.89 13.23A7.12 7.12 0 0 0 19 12v-2"/><path d="M5 10v2a7 7 0 0 0 12 5"/><path d="M15 9.34V5a3 3 0 0 0-5.68-1.33"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12"/><line x1="12" x2="12" y1="19" y2="22"/><line x1="8" x2="16" y1="22" y2="22"/>,
        loader: <path d="M21 12a9 9 0 1 1-6.219-8.56"/>,
        volume: <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>,
        check: <polyline points="20 6 9 17 4 12"/>,
        x: <line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/>,
        save: <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>,
        wand: <path d="M15 4V2"/><path d="M15 16v-2"/><path d="M8 9h2"/><path d="M20 9h2"/><path d="M17.8 11.8l1.4 1.4"/><path d="M10.8 6.2l1.4 1.4"/><path d="M17.8 6.2l1.4-1.4"/><path d="M10.8 11.8l1.4-1.4"/><path d="m3 21 9-9"/><path d="M12.2 6.2 11 5l-2.6 2.6c-.6.6-.6 1.4 0 2l1.8 1.8c.6.6 1.4.6 2 0z"/>,
        alert: <circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>,
        book: <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>,
        rotate: <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>,
        bookmark: <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/>,
        chart: <line x1="18" x2="18" y1="20" y2="10"/><line x1="12" x2="12" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="14"/>,
        arrowLeft: <line x1="19" x2="5" y1="12" y2="12"/><polyline points="12 19 5 12 12 5"/>,
        checkCircle: <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
      };
      return (
        <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} >
          {icons[name]}
        </svg>
      );
    };

    const callGemini = async (prompt, schema) => {
      // 确保使用最新的 3.6 模型
      const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`;
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            systemInstruction: { parts: [{ text: "你是一个专业的英语口语教练。请严格按照要求的JSON格式输出结果。纯中文回复，除明确要求加粗的成分外，绝对不要使用 ** 或星号等标记。" }] },
            generationConfig: { responseMimeType: "application/json", responseSchema: schema }
          })
        });
        const data = await response.json();
        if (data.error) throw new Error(data.error.message);
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          return JSON.parse(data.candidates[0].content.parts[0].text);
        }
        throw new Error("Invalid API response");
      } catch (err) {
        console.error("Gemini API Error:", err);
        throw err;
      }
    };

    function createWavBlob(base64Data, sampleRate = 24000) {
      const binaryString = window.atob(base64Data);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) bytes[i] = binaryString.charCodeAt(i);
      const buffer = new ArrayBuffer(44 + bytes.length);
      const view = new DataView(buffer);
      const writeString = (offset, string) => { for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i)); };
      writeString(0, 'RIFF'); view.setUint32(4, 36 + bytes.length, true);
      writeString(8, 'WAVE'); writeString(12, 'fmt ');
      view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true); view.setUint16(34, 16, true);
      writeString(36, 'data'); view.setUint32(40, bytes.length, true);
      const dataArray = new Uint8Array(buffer, 44); dataArray.set(bytes);
      return new Blob([buffer], { type: 'audio/wav' });
    }

    const callGeminiTTS = async (text) => {
      if (!text) return;
      // 强制清洗所有星号，防止语音引擎读出 "asterisk"
      const cleanText = text.replace(/[*＊_]/g, '');
      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: cleanText }] }],
            generationConfig: { responseModalities: ["AUDIO"], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Aoede" } } } },
            model: "gemini-2.5-flash-preview-tts"
          })
        });
        const data = await response.json();
        const base64Data = data.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
        if (base64Data) {
          const blob = createWavBlob(base64Data, 24000);
          const audio = new Audio(URL.createObjectURL(blob));
          audio.play();
        }
      } catch (err) { alert("语音合成请求失败，请检查网络。"); }
    };

    function useLocalStorage(key, initialValue) {
      const [storedValue, setStoredValue] = useState(() => {
        try { const item = window.localStorage.getItem(key); return item ? JSON.parse(item) : initialValue; } 
        catch (error) { return initialValue; }
      });
      const setValue = (value) => {
        try {
          const valueToStore = value instanceof Function ? value(storedValue) : value;
          setStoredValue(valueToStore); window.localStorage.setItem(key, JSON.stringify(valueToStore));
        } catch (error) { console.error(error); }
      };
      return [storedValue, setValue];
    }

    function useSpeech() {
      const [isRecording, setIsRecording] = useState(false);
      const [transcript, setTranscript] = useState({ text: '', timestamp: 0 });
      const [error, setError] = useState('');
      const recognitionRef = useRef(null);

      useEffect(() => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
          const recognition = new SpeechRecognition();
          recognition.continuous = true; recognition.interimResults = false; recognition.lang = 'en-US';
          recognition.onresult = (event) => {
            let finalStr = '';
            for (let i = event.resultIndex; i < event.results.length; i++) {
              if (event.results[i].isFinal) finalStr += event.results[i][0].transcript;
            }
            if (finalStr) setTranscript({ text: finalStr.trim(), timestamp: Date.now() });
          };
          recognition.onerror = (event) => { if (event.error !== 'no-speech') { setError(`录音错误`); setIsRecording(false); } };
          recognition.onend = () => setIsRecording(false);
          recognitionRef.current = recognition;
        } else { setError('浏览器不支持语音识别，请直接打字。'); }
      }, []);

      const startRecording = useCallback(() => { setError(''); if (recognitionRef.current) { recognitionRef.current.start(); setIsRecording(true); } }, []);
      const stopRecording = useCallback(() => { if (recognitionRef.current) { recognitionRef.current.stop(); setIsRecording(false); } }, []);
      return { isRecording, transcript, startRecording, stopRecording, error };
    }

    const FormatBoldText = ({ text }) => {
      if (!text) return null;
      const parts = text.split(/(\*\*.*?\*\*)/g);
      return <span>{parts.map((part, i) => part.startsWith('**') && part.endsWith('**') ? <strong key={i} className="font-bold text-stone-900 mx-0.5">{part.slice(2, -2)}</strong> : part)}</span>;
    };

    const TtsButton = ({ text, className = "" }) => {
      const [isPlaying, setIsPlaying] = useState(false);
      const handlePlay = async () => { if (isPlaying) return; setIsPlaying(true); await callGeminiTTS(text); setIsPlaying(false); };
      return (
        <button onClick={handlePlay} disabled={isPlaying} className={`flex items-center justify-center p-1.5 rounded-full bg-stone-100 text-stone-500 hover:bg-stone-200 transition-all ${className}`} title="播放">
          {isPlaying ? <Icon name="loader" className="animate-spin" size={14}/> : <Icon name="volume" size={14}/>}
        </button>
      );
    }

    const SpeechTextarea = ({ label, value, onChange, placeholder, hint }) => {
      const { isRecording, transcript, startRecording, stopRecording, error } = useSpeech();
      const [localText, setLocalText] = useState(value);
      useEffect(() => setLocalText(value), [value]);
      useEffect(() => { if (isRecording && transcript.text) onChange((localText ? localText + ' ' : '') + transcript.text); }, [transcript]);

      return (
        <div className="flex flex-col gap-2 mb-6">
          <div className="flex items-center justify-between">
            <label className="text-sm font-semibold text-stone-700">{label}</label>
            {hint && <span className="text-xs text-stone-500 bg-stone-200 px-2 py-1 rounded">{hint}</span>}
          </div>
          <div className="relative">
            <textarea className="w-full h-40 p-4 bg-stone-50 border border-stone-300 rounded-sm focus:outline-none focus:border-stone-500 text-stone-800 resize-none leading-relaxed" placeholder={placeholder} value={localText} onChange={(e) => { setLocalText(e.target.value); onChange(e.target.value); }} />
            <button onClick={isRecording ? stopRecording : startRecording} className={`absolute bottom-3 right-3 p-2 rounded-full transition-colors ${isRecording ? 'bg-red-500 text-white animate-pulse' : 'bg-stone-200 text-stone-600 hover:bg-stone-300'}`}>
              {isRecording ? <Icon name="micOff" size={18}/> : <Icon name="mic" size={18}/>}
            </button>
          </div>
          {error && <p className="text-xs text-red-600 mt-1">{error}</p>}
        </div>
      );
    };

    const VerificationBlock = ({ expressionData, onSaveSuccess }) => {
      const [sentence, setSentence] = useState('');
      const [status, setStatus] = useState('idle'); 
      const [feedback, setFeedback] = useState('');
      
      const verifySentence = async () => {
        if (!sentence.trim()) return;
        setStatus('checking');
        const prompt = `目标短语：${expressionData.base_phrase}\n新句子：${sentence}\n任务：判断新句子是否正确自然。纯中文回复，无任何星号等标记。`;
        const schema = { type: "OBJECT", properties: { pass: { type: "BOOLEAN" }, feedback: { type: "STRING" } }, required: ["pass", "feedback"] };
        try {
          const result = await callGemini(prompt, schema);
          setStatus(result.pass ? 'pass' : 'fail');
          setFeedback((result.feedback || '').replace(/[*＊_`]/g, ''));
        } catch (e) { setStatus('idle'); setFeedback('审核请求失败，请重试'); }
      };

      return (
        <div className="mt-4 p-4 bg-stone-100 border-l-4 border-stone-400 text-sm flex flex-col gap-3">
          <SpeechTextarea label="" value={sentence} onChange={setSentence} placeholder="在此输入你的新造句..." />
          {status === 'fail' && (
            <div className="p-3 bg-red-50 text-red-800 border border-red-200 rounded-sm"><p className="font-semibold mb-1">提示</p><p className="whitespace-pre-wrap">{feedback}</p></div>
          )}
          {status === 'pass' && (
            <div className="p-3 bg-green-50 text-green-800 border border-green-200 rounded-sm flex items-center justify-between">
              <p className="font-semibold flex items-center gap-1"><Icon name="check" size={16}/>完全正确</p>
              <button onClick={() => onSaveSuccess(expressionData, sentence)} className="flex items-center gap-1 bg-stone-800 text-stone-50 px-3 py-1.5 rounded-sm hover:bg-stone-700"><Icon name="save" size={14}/>存入</button>
            </div>
          )}
          {status !== 'pass' && (
            <button onClick={verifySentence} disabled={status === 'checking' || !sentence.trim()} className="self-end px-4 py-2 bg-stone-200 text-stone-800 font-medium rounded-sm hover:bg-stone-300 disabled:opacity-50 flex items-center gap-2">
              {status === 'checking' ? <Icon name="loader" className="animate-spin" size={16}/> : '检查'}
            </button>
          )}
        </div>
      );
    };

    const ReviewTab = ({ dbExpressions, setDbExpressions }) => {
      const now = Date.now();
      const dueItems = dbExpressions.filter(item => item.nextReviewDate <= now);
      const [currentItemIndex, setCurrentItemIndex] = useState(0);
      const [reviewSentence, setReviewSentence] = useState('');
      const [status, setStatus] = useState('idle');
      const [aiAnalysis, setAiAnalysis] = useState(null); 

      if (dueItems.length === 0) {
        return (
          <div className="flex flex-col items-center justify-center py-20 text-stone-500">
            <Icon name="checkCircle" size={48} className="mb-4 text-emerald-400 opacity-50" />
            <p className="text-lg font-serif">今日复习已完成</p>
            <p className="text-sm mt-2">去练习模块录入新的内容吧</p>
          </div>
        );
      }

      const currentItem = dueItems[currentItemIndex];

      const handleAIAnalysis = async () => {
        if (!reviewSentence.trim()) return;
        setStatus('checking');
        const prompt = `目标核心短语：${currentItem.expression}\n用户新造句子：${reviewSentence}\n任务：判断是否正确自然。纯中文回复，绝不输出星号。`;
        const schema = { type: "OBJECT", properties: { pass: { type: "BOOLEAN" }, feedback: { type: "STRING" } }, required: ["pass", "feedback"] };

        try {
          const result = await callGemini(prompt, schema);
          setAiAnalysis({ pass: result.pass, feedback: (result.feedback || '').replace(/[*＊_`]/g, '') });
          setStatus('evaluated');
        } catch (e) {
          setStatus('idle');
          alert('分析请求失败，请检查网络');
        }
      };

      const handleUserDecision = (isPass) => {
        const updatedExpressions = dbExpressions.map(exp => {
          if (exp.id === currentItem.id) {
            let newInterval = isPass ? Math.min(exp.interval * 2, 30) : 1;
            return { ...exp, interval: newInterval, nextReviewDate: Date.now() + newInterval * 24 * 60 * 60 * 1000 };
          }
          return exp;
        });
        setDbExpressions(updatedExpressions);
        if (currentItemIndex < dueItems.length - 1) {
          setCurrentItemIndex(prev => prev + 1); setReviewSentence(''); setStatus('idle'); setAiAnalysis(null);
        } else {
          setCurrentItemIndex(0); 
        }
      };

      return (
        <div className="max-w-md mx-auto animate-fade-in">
          <div className="mb-6 flex justify-between items-center text-sm text-stone-500">
            <span>待复习: {dueItems.length - currentItemIndex}</span>
            <span>当前周期: {currentItem.interval}天</span>
          </div>
          <div className="bg-white border border-stone-200 p-6 rounded-sm shadow-sm mb-6">
            <div className="mb-6">
              <span className="text-xs font-semibold tracking-wider text-stone-400 uppercase">Target Expression</span>
              <div className="flex items-start gap-3 mt-1 mb-2">
                <h2 className="text-xl font-bold text-stone-900 leading-tight">{currentItem.expression}</h2>
                <TtsButton text={currentItem.expression} className="mt-1 shrink-0" />
              </div>
              <div className="text-sm text-stone-600 bg-stone-50 p-3 rounded-sm whitespace-pre-line border border-stone-100">{currentItem.explanation}</div>
            </div>
            <div className="mt-8">
               <SpeechTextarea label="造一个新句子" value={reviewSentence} onChange={setReviewSentence} placeholder="直接开始说或者打字..." />
            </div>
            {status === 'idle' && (
               <button onClick={handleAIAnalysis} disabled={!reviewSentence.trim()} className="w-full py-3 bg-stone-800 text-stone-50 font-medium rounded-sm hover:bg-stone-900 transition-colors">提交给 AI 检查</button>
            )}
            {status === 'checking' && (
               <button disabled className="w-full py-3 bg-stone-300 text-stone-600 font-medium rounded-sm flex items-center justify-center gap-2"><Icon name="loader" size={18} className="animate-spin" /> 正在分析...</button>
            )}
            {status === 'evaluated' && aiAnalysis && (
              <div className="animate-slide-up">
                <div className={`mb-6 p-4 rounded-sm text-sm border ${aiAnalysis.pass ? 'bg-green-50 text-green-900 border-green-200' : 'bg-red-50 text-red-900 border-red-200'}`}>
                  <p className="font-semibold mb-2 flex items-center gap-1">
                    {aiAnalysis.pass ? <Icon name="check" size={16}/> : <Icon name="x" size={16} />} 
                    AI 参考判定：{aiAnalysis.pass ? '合理' : '存在问题'}
                  </p>
                  <p className="whitespace-pre-wrap leading-relaxed">{aiAnalysis.feedback}</p>
                </div>
                <p className="text-center text-xs text-stone-500 mb-3 font-medium">请自行确认本次复习结果：</p>
                <div className="flex gap-3">
                   <button onClick={() => handleUserDecision(false)} className="flex-1 py-3 bg-stone-100 text-stone-700 border border-stone-300 font-medium rounded-sm hover:bg-stone-200 transition-colors">需要再练</button>
                   <button onClick={() => handleUserDecision(true)} className="flex-1 py-3 bg-stone-800 text-stone-50 font-medium rounded-sm hover:bg-stone-900 transition-colors">通过</button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    };

    function App() {
      // 状态管理全面恢复
      const [activeTab, setActiveTab] = useState('practice'); 
      const [toastMessage, setToastMessage] = useState('');
      
      const [dbStats, setDbStats] = useLocalStorage('retell_stats', { practiceCount: 0 });
      const [dbErrors, setDbErrors] = useLocalStorage('retell_errors', []); // 错题本恢复
      const [dbExpressions, setDbExpressions] = useLocalStorage('retell_expressions', []);

      const [originalText, setOriginalText] = useState('');
      const [retellText, setRetellText] = useState('');
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [analysisResult, setAnalysisResult] = useState(null);
      
      const [isGenerating, setIsGenerating] = useState(false);
      const [topicInput, setTopicInput] = useState('');
      const [showGenerator, setShowGenerator] = useState(false);

      const showToast = (msg) => { setToastMessage(msg); setTimeout(() => setToastMessage(''), 3000); };

      const handleGenerateMaterial = async () => {
        setIsGenerating(true);
        const prompt = `Please write a short English passage (80-100 words) for B1-B2 retelling. Topic: ${topicInput || 'Daily life'}. Return ONLY JSON.`;
        const schema = { type: "OBJECT", properties: { passage: { type: "STRING" } }, required: ["passage"] };
        try {
          const result = await callGemini(prompt, schema);
          if (result?.passage) { setOriginalText(result.passage); setShowGenerator(false); }
        } catch (e) { alert("生成失败，请稍后重试。"); } 
        finally { setIsGenerating(false); }
      };

      const handleAnalyze = async () => {
        if (!originalText.trim() || !retellText.trim()) return;
        setIsAnalyzing(true); setAnalysisResult(null);
        
        // 彻底还原了极其严谨完整的 AI 提示词指令
        const fullPrompt = `
          原文：${originalText}
          用户复述：${retellText}
          
          任务：对比原文和用户的复述，严格按要求输出 JSON：
          1. grammar: 找出用户复述中的语法错误。
             - original: 包含该错误的【完整原句】（必须提取整个句子）。
             - corrected: 订正后的【完整正确句子】。请使用 ** 来包裹被修改或订正的核心成分（如 "I **went** to the store."）。
             - explanation: 语法说明。
             - type: 错误的极其笼统的大类（仅限以下几个大类之一：时态、词性、单复数、介词、代词、语序、搭配、其他）。
          2. missing: 原文中存在但用户复述完全遗漏的核心信息点（字符串数组）。
          3. upgrades: 找出用户复述中偏简单/中式的表达，给出更地道的说法。
             - original_simple_sentence: 用户原表达所在的【完整原句或分句】。注意：请必须先修正该句中的基础语法错误，然后再输出。请使用 **包裹原本简单的核心成分**。
             - better_expression_sentence: 包含地道表达的【完整句子】。请【仅】使用 ** 包裹更地道的核心成分，【绝对不要】把整句话都加粗。
             - base_phrase: 将上述升级的核心成分提炼为【无时态变形的原形短语】，例如 get lost, step out of comfort zone。
             - ai_example: 必须包含中英对照！(en 为纯英文，zh 为纯中文，绝对不允许在这个对象中使用 ** 加粗符号)
             - source: 如果原文有对应表达填 "原文表达"，AI自己发挥填 "AI 升级"。
          4. final_polished_text: 【核心要求】这必须是在【用户原本的复述】基础上进行的润色和修改，绝对【不是】照搬原故事。保留用户原本表达合理的句子结构，仅把前面指出的语法错误订正和表达升级缝合进去，形成一段连贯的英文段落。被你修改过的成分（语法或词汇）请严格使用 ** 包裹高亮，用户原本说得好的地方保留普通文本。
        `;

        const schema = {
          type: "OBJECT",
          properties: {
            grammar: { type: "ARRAY", items: { type: "OBJECT", properties: { original: { type: "STRING" }, corrected: { type: "STRING" }, explanation: { type: "STRING" }, type: { type: "STRING" } } } },
            missing: { type: "ARRAY", items: { type: "STRING" } }, // 修复：确保 Schema 里有遗漏点数组
            upgrades: { type: "ARRAY", items: { type: "OBJECT", properties: { original_simple_sentence: { type: "STRING" }, better_expression_sentence: { type: "STRING" }, base_phrase: { type: "STRING" }, ai_example: { type: "OBJECT", properties: { en: { type: "STRING" }, zh: { type: "STRING" } } }, source: { type: "STRING" } } } },
            final_polished_text: { type: "STRING" }
          },
          required: ["grammar", "missing", "upgrades", "final_polished_text"]
        };

        try {
          const result = await callGemini(fullPrompt, schema);
          setAnalysisResult(result);
          
          setDbStats(prev => ({ ...prev, practiceCount: (prev.practiceCount || 0) + 1 }));
          
          // 记录错题，供统计模块使用
          if (result.grammar && result.grammar.length > 0) {
            const newErrors = result.grammar.map(g => ({ ...g, date: Date.now() }));
            setDbErrors(prev => [...newErrors, ...prev].slice(0, 100)); // 保留最近100条
          }

          setActiveTab('analysis');
        } catch (e) { alert("分析请求失败，可能是网络拥堵。"); } 
        finally { setIsAnalyzing(false); }
      };

      const saveExpression = (data, example) => {
        if (dbExpressions.some(exp => exp.expression.toLowerCase() === data.base_phrase.toLowerCase())) { return showToast("已存在于表达库中！"); }
        const newExp = { id: Date.now().toString(), expression: data.base_phrase, explanation: `[范例]\n${data.ai_example.en}\n${data.ai_example.zh}`, source: data.source, example: example, interval: 1, nextReviewDate: Date.now() + 86400000 };
        setDbExpressions(prev => [newExp, ...prev]);
        showToast("存入成功！");
      };

      const renderStats = () => {
        const errorTypes = dbErrors.reduce((acc, curr) => { acc[curr.type] = (acc[curr.type] || 0) + 1; return acc; }, {});
        const sortedErrors = Object.entries(errorTypes).sort((a, b) => b[1] - a[1]);

        return (
          <div className="max-w-2xl mx-auto animate-fade-in">
            <div className="grid grid-cols-2 gap-4 mb-8">
              <div className="bg-stone-100 p-6 rounded-sm border border-stone-200 flex flex-col items-center justify-center">
                <span className="text-3xl font-bold text-stone-800">{dbStats.practiceCount || 0}</span>
                <span className="text-sm text-stone-500 mt-1">累计练习次数</span>
              </div>
              <div className="bg-stone-100 p-6 rounded-sm border border-stone-200 flex flex-col items-center justify-center">
                <span className="text-3xl font-bold text-stone-800">{dbExpressions.length}</span>
                <span className="text-sm text-stone-500 mt-1">表达库总量</span>
              </div>
            </div>

            <div className="mb-10">
              <h3 className="text-lg font-serif font-bold text-stone-800 mb-4 border-b border-stone-200 pb-2">高频语法弱点</h3>
              {sortedErrors.length === 0 ? (<p className="text-stone-500 text-sm">暂无数据</p>) : (
                <div className="space-y-3">
                  {sortedErrors.map(([type, count]) => (
                    <div key={type} className="flex items-center text-sm">
                      <span className="w-24 text-stone-600 truncate">{type}</span>
                      <div className="flex-1 bg-stone-200 h-2 mx-3 rounded-full overflow-hidden">
                        <div className="bg-stone-500 h-full" style={{ width: `${Math.min((count / sortedErrors[0][1]) * 100, 100)}%` }}></div>
                      </div>
                      <span className="w-8 text-right text-stone-500">{count}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>

            <div>
              <h3 className="text-lg font-serif font-bold text-stone-800 mb-4 border-b border-stone-200 pb-2">最近错题记录</h3>
              {dbErrors.length === 0 ? (<p className="text-stone-500 text-sm">暂无数据</p>) : (
                <div className="space-y-4">
                  {dbErrors.slice(0, 10).map((err, i) => (
                    <div key={i} className="bg-white border border-stone-200 rounded-sm p-4 shadow-sm relative">
                      <div className="flex justify-between items-center mb-3">
                        <span className="text-xs font-semibold text-stone-500 bg-stone-100 px-2 py-1 rounded uppercase">{err.type}</span>
                        <span className="text-xs text-stone-400">{new Date(err.date).toLocaleDateString()}</span>
                      </div>
                      <div className="mb-3 pl-2 border-l-2 border-red-200"><p className="text-sm text-stone-500 line-through leading-relaxed">{err.original}</p></div>
                      <div className="mb-3 pl-2 border-l-2 border-green-300"><p className="text-base text-stone-800 font-medium leading-relaxed"><FormatBoldText text={err.corrected} /></p></div>
                      <div className="bg-stone-50 p-3 rounded-sm text-sm text-stone-600 border border-stone-100 mt-2 flex items-start gap-2">
                        <Icon name="alert" size={16} className="shrink-0 mt-0.5 text-stone-400" /><span>{err.explanation}</span>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        );
      };

      return (
        <div className="min-h-screen bg-[#F9F9F7] text-[#333333] font-sans relative pb-24">
          <style dangerouslySetInnerHTML={{__html: `.pb-safe { padding-bottom: calc(env(safe-area-inset-bottom) + 8px); } @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } } @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } } .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; } .animate-slide-up { animation: slideUp 0.4s ease-out forwards; }`}} />
          
          {toastMessage && (
            <div className="fixed top-6 left-1/2 transform -translate-x-1/2 z-50 bg-stone-800 text-white px-5 py-2.5 rounded-sm shadow-xl flex items-center gap-2 animate-slide-up">
              <Icon name="check" size={16} className="text-emerald-400" /> <span className="text-sm">{toastMessage}</span>
            </div>
          )}

          <header className="bg-[#F9F9F7] border-b border-stone-200 sticky top-0 z-10 px-4 py-3 flex justify-center">
            <h1 className="font-serif font-bold text-xl tracking-wide text-stone-800">Retell<span className="text-stone-400">Note</span></h1>
          </header>

          <main className="p-4 sm:p-6 h-full max-w-2xl mx-auto">
            {activeTab === 'practice' && (
              <div className="animate-fade-in">
                <div className="bg-stone-100 p-4 border-l-4 border-stone-800 mb-8 rounded-r-sm flex justify-between items-start">
                  <p className="text-stone-700 font-serif text-sm">"种下一棵树最好的时间是十年前，其次是现在。"</p>
                  <button onClick={() => setShowGenerator(!showGenerator)} className="shrink-0 ml-4 flex items-center gap-1 text-xs font-medium bg-white border border-stone-300 px-2.5 py-1.5 rounded-sm text-stone-700 hover:bg-stone-50 shadow-sm">
                    <Icon name="wand" size={14} className="text-amber-500" /> 智能素材
                  </button>
                </div>
                {showGenerator && (
                  <div className="mb-6 p-4 bg-white border border-amber-200 rounded-sm shadow-sm animate-slide-up">
                    <label className="block text-sm font-semibold mb-2">生成复述素材：</label>
                    <div className="flex gap-2">
                      <input type="text" value={topicInput} onChange={(e) => setTopicInput(e.target.value)} placeholder="如：第一次面试..." className="flex-1 p-2 text-sm border border-stone-300 rounded-sm focus:outline-none focus:border-stone-500" />
                      <button onClick={handleGenerateMaterial} disabled={isGenerating} className="px-4 py-2 bg-stone-800 text-white text-sm font-medium rounded-sm disabled:opacity-50 flex items-center gap-2">
                        {isGenerating ? <Icon name="loader" size={16} className="animate-spin" /> : '生成'}
                      </button>
                    </div>
                  </div>
                )}
                <SpeechTextarea label="原文材料" value={originalText} onChange={setOriginalText} placeholder="请粘贴原文..." hint="Paste here" />
                <SpeechTextarea label="你的复述" value={retellText} onChange={setRetellText} placeholder="点击麦克风开始录音..." hint="Speak out loud" />
                <button onClick={handleAnalyze} disabled={isAnalyzing || !originalText.trim() || !retellText.trim()} className="w-full py-4 bg-stone-800 text-stone-50 font-medium tracking-widest rounded-sm hover:bg-stone-900 disabled:bg-stone-300 transition-all flex justify-center items-center gap-2">
                  {isAnalyzing ? <Icon name="loader" className="animate-spin" /> : '开始分析'}
                </button>
              </div>
            )}

            {activeTab === 'analysis' && analysisResult && (
              <div className="animate-fade-in space-y-10">
                <button onClick={() => setActiveTab('practice')} className="flex items-center gap-2 text-sm text-stone-500 hover:text-stone-800 mb-6"><Icon name="arrowLeft" size={16} /> 返回练习</button>
                
                <div>
                  <h2 className="text-xl font-serif font-bold mb-6 flex items-center gap-2"><span className="w-1.5 h-6 bg-red-400"></span>语法订正</h2>
                  {analysisResult.grammar.length === 0 ? <p className="text-stone-500 italic">未发现明显错误。</p> : (
                    <div className="space-y-4">
                      {analysisResult.grammar.map((item, i) => (
                        <div key={i} className="bg-white border border-stone-200 p-5 rounded-sm shadow-sm">
                          <p className="line-through text-stone-400 mb-2">{item.original}</p>
                          <div className="flex items-start gap-3 mb-3"><p className="font-medium text-lg"><FormatBoldText text={item.corrected} /></p><TtsButton text={item.corrected} className="mt-1 shrink-0" /></div>
                          <div className="flex items-start gap-2 text-sm text-stone-600 bg-stone-50 p-3 rounded-sm border"><Icon name="alert" size={16} className="mt-0.5 shrink-0 text-stone-400" /><p><span className="font-semibold mr-1">[{item.type}]</span>{item.explanation}</p></div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {/* 彻底恢复上次遗漏的“遗漏信息点”分析模块 */}
                {analysisResult.missing && analysisResult.missing.length > 0 && (
                  <div>
                    <h2 className="text-xl font-serif font-bold mb-6 flex items-center gap-2"><span className="w-1.5 h-6 bg-amber-400"></span>遗漏信息点</h2>
                    <ul className="list-disc list-outside ml-5 space-y-2 text-stone-700 bg-amber-50/50 p-4 rounded-sm border border-amber-100">
                      {analysisResult.missing.map((item, i) => (
                        <li key={i}>{item}</li>
                      ))}
                    </ul>
                  </div>
                )}

                <div>
                  <h2 className="text-xl font-serif font-bold mb-6 flex items-center gap-2"><span className="w-1.5 h-6 bg-emerald-500"></span>表达升级</h2>
                  {analysisResult.upgrades.length === 0 ? <p className="text-stone-500 italic">表达足够自然。</p> : (
                    <div className="space-y-8">
                      {analysisResult.upgrades.map((item, i) => (
                        <div key={i} className="bg-white border border-stone-200 p-6 rounded-sm shadow-sm relative overflow-hidden">
                          <span className="absolute top-0 right-0 bg-stone-100 text-stone-500 text-xs px-3 py-1 rounded-bl-sm border-b border-l">{item.source}</span>
                          <div className="mb-5"><p className="text-xs text-stone-400 uppercase mb-2">你的原句</p><p className="text-stone-600"><FormatBoldText text={item.original_simple_sentence} /></p></div>
                          <div className="mb-5"><p className="text-xs text-stone-400 uppercase mb-2">地道表达</p><div className="flex items-start gap-3"><p className="text-lg text-stone-900 font-medium"><FormatBoldText text={item.better_expression_sentence} /></p><TtsButton text={item.better_expression_sentence} className="mt-1 shrink-0" /></div></div>
                          <div className="mb-5 bg-stone-50 p-4 rounded-sm border"><p className="text-sm font-bold mb-1">核心短语：'{item.base_phrase}'</p><div className="border-t border-stone-200 pt-3 flex items-start gap-3 mt-3"><div className="flex-1"><p className="text-xs text-stone-400 uppercase mb-1">AI 范例</p><div className="text-sm"><p className="text-stone-800">{item.ai_example?.en}</p><p className="text-stone-500 mt-1">{item.ai_example?.zh}</p></div></div>{item.ai_example?.en && <TtsButton text={item.ai_example.en} className="shrink-0" />}</div></div>
                          <div className="border-t pt-4 border-dashed"><VerificationBlock expressionData={item} onSaveSuccess={saveExpression} /></div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                <div>
                  <h2 className="text-xl font-serif font-bold mb-6 flex items-center gap-2"><span className="w-1.5 h-6 bg-blue-500"></span>完整复述参考</h2>
                  <div className="bg-white border border-stone-200 p-6 rounded-sm shadow-sm relative"><p className="leading-relaxed text-stone-800 pr-8"><FormatBoldText text={analysisResult.final_polished_text} /></p><div className="absolute top-4 right-4"><TtsButton text={analysisResult.final_polished_text} /></div></div>
                </div>
              </div>
            )}

            {activeTab === 'review' && <ReviewTab dbExpressions={dbExpressions} setDbExpressions={setDbExpressions} />}

            {activeTab === 'library' && (
              <div className="animate-fade-in">
                {dbExpressions.length === 0 ? (
                  <div className="flex flex-col items-center justify-center py-20 text-stone-500"><Icon name="bookmark" size={48} className="mb-4 opacity-20" /><p className="text-lg font-serif">表达库为空</p></div>
                ) : (
                  <div>
                    <h2 className="text-2xl font-serif font-bold mb-2">表达库</h2><p className="text-sm text-stone-500 mb-8">共积攒了 {dbExpressions.length} 个地道表达</p>
                    <div className="space-y-6">
                      {dbExpressions.map((item) => (
                        <div key={item.id} className="bg-white border border-stone-200 p-5 rounded-sm shadow-sm">
                          <div className="flex items-start justify-between mb-3">
                            <div className="flex items-center gap-3"><h3 className="text-lg font-bold text-stone-900">{item.expression}</h3><TtsButton text={item.expression} /></div>
                            <span className="text-xs font-mono text-stone-400 bg-stone-50 px-2 py-1 rounded">下次复习: {new Date(item.nextReviewDate).toLocaleDateString()}</span>
                          </div>
                          <p className="text-sm text-stone-600 mb-4 whitespace-pre-line leading-relaxed">{item.explanation}</p>
                          {item.example && <div className="border-t border-stone-100 pt-3"><p className="text-xs text-stone-400 uppercase mb-1">造句记录</p><p className="text-sm text-stone-700 italic">"{item.example}"</p></div>}
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}

            {activeTab === 'stats' && renderStats()}
          </main>

          <nav className="fixed bottom-0 w-full bg-[#F9F9F7] border-t border-stone-200 flex justify-around items-center h-[72px] pb-safe text-xs font-medium text-stone-500 z-20 shadow-[0_-4px_12px_rgba(0,0,0,0.02)]">
            <button onClick={() => setActiveTab('practice')} className={`flex flex-col items-center justify-center w-full h-full space-y-1 ${(activeTab === 'practice' || activeTab === 'analysis') ? 'text-stone-900' : ''}`}><Icon name="book" size={20}/><span>练习</span></button>
            <button onClick={() => setActiveTab('review')} className={`flex flex-col items-center justify-center w-full h-full space-y-1 relative ${activeTab === 'review' ? 'text-stone-900' : ''}`}>
              <Icon name="rotate" size={20}/><span>复习</span>
              {dbExpressions.filter(item => item.nextReviewDate <= Date.now()).length > 0 && (<span className="absolute top-2.5 right-[28%] w-2 h-2 bg-red-500 rounded-full"></span>)}
            </button>
            <button onClick={() => setActiveTab('library')} className={`flex flex-col items-center justify-center w-full h-full space-y-1 ${activeTab === 'library' ? 'text-stone-900' : ''}`}><Icon name="bookmark" size={20}/><span>表达库</span></button>
            <button onClick={() => setActiveTab('stats')} className={`flex flex-col items-center justify-center w-full h-full space-y-1 ${activeTab === 'stats' ? 'text-stone-900' : ''}`}><Icon name="chart" size={20}/><span>统计</span></button>
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
